services:
  - type: web
    name: stayos-booking-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: stayos-booking-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://krishnashine716-create.github.io

databases:
  - name: stayos-booking-db
    plan: free
    databaseName: stayos_bookings
    user: stayos_app
