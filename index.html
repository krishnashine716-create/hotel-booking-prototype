<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1720" />
    <meta name="description" content="Modern direct booking website prototype for independent hotels." />
    <title>The Grandview Raipur</title>
    <style>
      #boot-fallback { min-height: 100vh; display:grid; place-items:center; padding:32px; background:#111317; color:#f8f5ef; font-family:system-ui,sans-serif; }
      #boot-fallback .card { max-width:560px; text-align:center; }
      #boot-fallback h1 { font:400 48px Georgia,serif; margin:0 0 12px; }
      #boot-fallback p { color:#aaa; line-height:1.7; }
      #boot-error { position:fixed; inset:0; z-index:99999; display:none; place-items:center; padding:24px; background:#111317; color:#f8f5ef; font-family:system-ui,sans-serif; }
      #boot-error .card { max-width:680px; width:100%; background:#1b1e23; border:1px solid #343942; border-radius:18px; padding:24px; }
      #boot-error pre { white-space:pre-wrap; overflow:auto; color:#ffb4b4; font-size:12px; }
    </style>
    <script>
      window.__showBootError = function(message) {
        var box = document.getElementById('boot-error');
        var text = document.getElementById('boot-error-text');
        if (box && text) { text.textContent = String(message); box.style.display = 'grid'; }
      };
      window.addEventListener('error', function(event) {
        window.__showBootError('JavaScript error: ' + (event.error && event.error.stack ? event.error.stack : event.message));
      });
      window.addEventListener('unhandledrejection', function(event) {
        window.__showBootError('Unhandled promise rejection: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason));
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback">
        <div class="card">
          <div style="letter-spacing:.18em;font-size:11px;color:#c8a56a;font-weight:700;">GRANDVIEW RAIPUR</div>
          <h1>Stay beautifully.</h1>
          <p>Loading the hotel experience…</p>
        </div>
      </div>
    </div>
    <div id="boot-error">
      <div class="card">
        <div style="letter-spacing:.16em;font-size:11px;color:#c8a56a;font-weight:700;">GRANDVIEW RAIPUR</div>
        <h2>Website startup error</h2>
        <p>The page loaded, but the application could not start.</p>
        <pre id="boot-error-text"></pre>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
